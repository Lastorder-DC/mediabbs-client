<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <!-- Keep "type" before "rel" on the SVG icon: @vue/cli-plugin-pwa hides the
         first icon link whose markup starts with rel inside an IE-only comment. -->
    <link type="image/svg+xml" rel="icon" href="<%= BASE_URL %>favicon.svg">
    <link rel="alternate icon" href="<%= BASE_URL %>favicon.ico">
    <link rel="stylesheet" href="//use.fontawesome.com/releases/v5.13.1/css/all.css" />
    <link rel="stylesheet" href="//use.fontawesome.com/releases/v5.13.1/css/v4-shims.css" />
    <title>게시판</title>
    <!-- Runtime settings (backend address); replaced at deploy time. -->
    <script src="<%= BASE_URL %>config.js"></script>
</head>

<body>
    <noscript>
        <strong>이 게시판을 이용하려면 자바스크립트가 필요합니다. 자바스크립트를 활성화해 주세요.</strong>
    </noscript>
    <div id="app"></div>
    <!-- built files will be auto injected -->
</body>

</html>
