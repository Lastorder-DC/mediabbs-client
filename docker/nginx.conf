# nginx configuration for the mediabbs-client image (static SPA).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Settings and entry points must never be cached by browsers/proxies.
    location = /config.js { add_header Cache-Control "no-cache"; include /etc/nginx/snippets/mediabbs-security-headers.conf; }
    location = /index.html { add_header Cache-Control "no-cache"; include /etc/nginx/snippets/mediabbs-security-headers.conf; }
    location = /service-worker.js { add_header Cache-Control "no-cache"; include /etc/nginx/snippets/mediabbs-security-headers.conf; }
    location = /registerSW.js { add_header Cache-Control "no-cache"; include /etc/nginx/snippets/mediabbs-security-headers.conf; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache"; include /etc/nginx/snippets/mediabbs-security-headers.conf; }

    # Content-hashed assets can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/mediabbs-security-headers.conf;
        try_files $uri =404;
    }

    # Single-page app: unknown paths (board / topic URLs) serve index.html.
    location / {
        include /etc/nginx/snippets/mediabbs-security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
