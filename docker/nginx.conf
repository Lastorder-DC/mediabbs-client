# nginx configuration for the mediabbs-client image (static SPA).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Settings and entry points must never be cached by browsers/proxies.
    location = /config.js { add_header Cache-Control "no-cache"; }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /service-worker.js { add_header Cache-Control "no-cache"; }

    # Content-hashed assets can be cached forever.
    location ~ ^/(js|css|img|fonts)/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Single-page app: unknown paths (board / topic URLs) serve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
