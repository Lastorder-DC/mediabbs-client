# Included in every location of nginx.conf (an add_header in a location drops
# the server-level ones).
# CSP: scripts only from this origin (no inline script, no eval), no plugins,
# no framing (clickjacking of the admin page), forms only to this origin.
# Connections, images and styles stay open: the API and wiki origins are
# runtime settings, and wiki content uses images and inline styles.
add_header Content-Security-Policy "script-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
